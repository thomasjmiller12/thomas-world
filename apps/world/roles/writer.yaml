# Role config for Writer Thomas
# tick_cadence_minutes: how often the scheduler fires an idle tick for this agent
# tick_models: provider-specific models used for autonomous idle ticks
# chat_models: provider-specific models used when a visitor opens a chat session
# daily_token_budget: soft budget cap in USD; when exceeded, agent status → "sleeping (budget)"
#   and the scheduler skips until the next UTC day resets the meter.
#   This per-agent budget is checked before each tick. The global DAILY_BUDGET_USD
#   env var is a hard ceiling across all agents combined.

# Writer runs slower — deliberate ticks with more output per cycle. The soul file
# explicitly notes that Writer uses the time. Fewer ticks, richer actions.
tick_cadence_minutes: 45
tick_models:
  anthropic: claude-sonnet-5
  openai: gpt-5.4
chat_models:
  anthropic: claude-sonnet-5
  openai: gpt-5.4
daily_token_budget: 5.25
